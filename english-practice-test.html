
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 10 English Practice Test | TutorVistaar</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f6ff;margin:0;padding:18px;color:#202b45}
.container{max-width:750px;margin:auto;background:white;padding:22px;border-radius:16px;box-shadow:0 4px 16px #0001}
h1{text-align:center;color:#244a9b}
.question{padding:15px;margin:15px 0;background:#f5f7ff;border-radius:10px}
label{display:block;padding:7px;cursor:pointer}
button,.link{display:inline-block;background:#244a9b;color:white;padding:12px 18px;border:0;border-radius:8px;text-decoration:none;font-weight:bold;margin:5px;cursor:pointer}
#result{font-size:20px;font-weight:bold;margin:20px 0}
.explanation{display:none;background:#e8f7ed;padding:10px;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<div class="container">
<h1>📘 Class 10 English Practice Test</h1>
<p>Choose the correct answer. Total Questions: 10</p>
<form id="quiz">
<div id="questions"></div>
<button type="submit">Check My Score</button>
<button type="button" onclick="location.reload()">Try Again</button>
</form>
<div id="result"></div>
<a class="link" href="index.html">← Back to TutorVistaar Home</a>
</div>
<script>
const qs=[
{q:"1. Choose the correct article: He is ___ honest man.",o:["a","an","the","no article"],a:1,e:"'Honest' begins with a vowel sound, so use 'an'."},
{q:"2. Choose the correct verb: She ___ to school every day.",o:["go","going","goes","gone"],a:2,e:"With 'she' in the simple present, use 'goes'."},
{q:"3. Choose the synonym of 'Brave'.",o:["Cowardly","Courageous","Weak","Lazy"],a:1,e:"Brave means courageous."},
{q:"4. Choose the antonym of 'Ancient'.",o:["Old","Historic","Modern","Past"],a:2,e:"Ancient means very old; its opposite is modern."},
{q:"5. Change into passive voice: Ram writes a letter.",o:["A letter wrote Ram.","A letter is written by Ram.","A letter was written by Ram.","Ram is written by a letter."],a:1,e:"Simple present passive: object + is/am/are + past participle."},
{q:"6. Choose the correct spelling.",o:["Beautifull","Beutiful","Beautiful","Beautifal"],a:2,e:"The correct spelling is Beautiful."},
{q:"7. Fill in the blank: I have lived here ___ 2020.",o:["for","since","from","by"],a:1,e:"Use 'since' with a starting point in time."},
{q:"8. Choose the correct indirect speech: He said, “I am happy.”",o:["He said that I am happy.","He said that he was happy.","He says he was happy.","He said that he is happy."],a:1,e:"In reported speech, 'am' usually changes to 'was' and 'I' to 'he'."},
{q:"9. Choose the plural of 'Child'.",o:["Childs","Childes","Children","Childrens"],a:2,e:"The plural of child is children."},
{q:"10. Identify the adjective: She has a beautiful dress.",o:["She","has","beautiful","dress"],a:2,e:"'Beautiful' describes the noun 'dress', so it is an adjective."}
];
const root=document.getElementById("questions");
qs.forEach((q,i)=>{
const d=document.createElement("div");d.className="question";
d.innerHTML="<p><b>"+q.q+"</b></p>"+q.o.map((op,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${op}</label>`).join("")+`<div class="explanation" id="exp${i}"></div>`;
root.appendChild(d);
});
document.getElementById("quiz").addEventListener("submit",function(ev){
ev.preventDefault();let score=0;
qs.forEach((q,i)=>{
const chosen=document.querySelector(`input[name="q${i}"]:checked`);
const exp=document.getElementById("exp"+i);
exp.style.display="block";
if(chosen&&Number(chosen.value)===q.a){score++;exp.innerHTML="✅ Correct! "+q.e;}
else{exp.innerHTML="❌ Correct answer: "+q.o[q.a]+". "+q.e;}
});
document.getElementById("result").textContent="Your Score: "+score+" / "+qs.length;
window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
});
</script>
</body>
</html>
