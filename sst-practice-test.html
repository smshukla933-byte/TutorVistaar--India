<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SST Test</title><style>body{font-family:Arial;background:#f5f7ff;padding:15px} .card{background:white;padding:15px;border-radius:14px;margin-bottom:12px} .opt{display:block;padding:10px;margin:5px 0;background:#eef2ff;border-radius:8px} .btn{width:100%;padding:14px;background:#f57c00;color:white;border:none;border-radius:10px;font-size:16px} #result{display:none;text-align:center;padding:20px;background:#e8f5e9;border-radius:14px;margin-top:15px}</style></head><body><h2>🌍 SST Test - 10 Q</h2><div id="quiz"></div><button class="btn" onclick="check()">Submit</button><div id="result"></div><script>const questions=[{q:"1. Suez Canal kab khula?",o:["1869","1900","1857","1947"],a:0},{q:"2. Dandi March kisne kiya?",o:["Gandhi ji","Nehru","Bhagat Singh","Patel"],a:0},{q:"3. Money ka kaam?",o:["Medium of exchange","Only paper","Gold","Silver"],a:0},{q:"4. Constitution me Schedules?",o:["12","10","8","15"],a:0},{q:"5. Resource ka type jo renewable hai?",o:["Solar","Coal","Petroleum","Iron"],a:0},{q:"6. Federalism me power?",o:["Divided","Central only","State only","King"],a:0},{q:"7. Globalization ka matlab?",o:["World connection","Only India","Village only","None"],a:0},{q:"8. Soil ka type Punjab me?",o:["Alluvial","Black","Red","Desert"],a:0},{q:"9. Democracy ki khasiyat?",o:["People power","King power","Army power","None"],a:0},{q:"10. RBI ka kaam?",o:["Bank of banks","School","Hospital","Factory"],a:0},];let h="";questions.forEach((qq,i)=>{h+=`<div class="card"><b>${qq.q}</b>`;qq.o.forEach((op,j)=>{h+=`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${op}</label>`});h+=`</div>`});document.getElementById("quiz").innerHTML=h;function check(){let s=0;questions.forEach((qq,i)=>{let sel=document.querySelector(`input[name="q${i}"]:checked`);if(sel&&parseInt(sel.value)==qq.a)s++});let r=document.getElementById("result");r.style.display="block";r.innerHTML=`<h2>Score: ${s}/10</h2><a href="https://wa.me/919580712072?text=SST score ${s}/10" style="padding:12px 20px;background:#25D366;color:white;border-radius:8px;text-decoration:none;display:inline-block;">WhatsApp bhejo</a><br><br><a href="index.html">Back</a>`;window.scrollTo(0,document.body.scrollHeight);}</script></body></html>
