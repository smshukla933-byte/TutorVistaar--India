<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class 10 Maths Test - Tutor Vistaar</title>
<style>
body{font-family:Arial;background:#f5f7ff;padding:15px;margin:0}
.card{background:white;padding:18px;border-radius:14px;box-shadow:0 2px 8px #0001;margin-bottom:15px}
.q{font-weight:bold;margin-bottom:10px}
.opt{display:block;padding:10px;margin:6px 0;background:#eef2ff;border-radius:8px;border:1px solid #c5cae9}
.opt input{margin-right:8px}
.btn{width:100%;padding:14px;background:#1877ff;color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold}
#result{display:none;text-align:center;padding:20px;background:#e8f5e9;border-radius:14px}
</style>
</head>
<body>
<h2>📘 Class 10 Maths - Practice Test (10 Q)</h2>
<div id="quiz"></div>
<button class="btn" onclick="check()">Submit Test</button>
<div id="result"></div>

<script>
const questions=[
{q:"1. √2 is a/an?",o:["Rational","Irrational","Integer","Natural"],a:1},
{q:"2. Zeroes of x²-2x-8 are?",o:["-2,4","2,-4","2,4","-2,-4"],a:0},
{q:"3. Discriminant of x²+4x+4=0?",o:["0","16","8","4"],a:0},
{q:"4. 5th term of AP 2,7,12...?",o:["22","27","17","32"],a:0},
{q:"5. sin²θ + cos²θ = ?",o:["0","1","2","-1"],a:1},
{q:"6. Area of circle r=7cm?",o:["154 cm²","44 cm²","49 cm²","100 cm²"],a:0},
{q:"7. Probability of sure event?",o:["0","1","0.5","2"],a:1},
{q:"8. HCF of 6 and 20 by Euclid?",o:["2","4","6","10"],a:0},
{q:"9. (a+b)² = ?",o:["a²+b²","a²+b²+2ab","a²+b²-2ab","a²-b²"],a:1},
{q:"10. Sum of angles of triangle?",o:["90°","180°","360°","270°"],a:1},
];
let html="";
questions.forEach((qq,i)=>{
 html+=`<div class="card"><div class="q">${qq.q}</div>`;
 qq.o.forEach((op,j)=>{
  html+=`<label class="opt"><input type="radio" name="q${i}" value="${j}">${op}</label>`;
 });
 html+=`</div>`;
});
document.getElementById("quiz").innerHTML=html;

function check(){
 let score=0;
 questions.forEach((qq,i)=>{
  let sel=document.querySelector(`input[name="q${i}"]:checked`);
  if(sel && parseInt(sel.value)==qq.a) score++;
 });
 document.getElementById("result").style.display="block";
 document.getElementById("result").innerHTML=`<h2>Your Score: ${score}/10</h2>
 <p>${score>=7?'Shabash! Bahut badhiya! 🎉':'Mehnat karo, aur behtar karoge! 💪'}</p>
 <a href="https://wa.me/919580712072?text=Maine Maths test me ${score}/10 score kiya!" style="display:inline-block;padding:12px 20px;background:#25D366;color:white;border-radius:8px;text-decoration:none;margin-top:10px;">Result WhatsApp pe bhejo</a>
 <br><br><a href="../index.html">⬅ Back to Home</a>`;
 window.scrollTo(0,document.body.scrollHeight);
}
</script>
</body>
</html>
