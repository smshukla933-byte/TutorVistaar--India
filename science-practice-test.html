//wa.me/919580712072?text=Science score ${s}/10" style="padding:12px 20px;background:#25D366;color:white;border-radius:8px;text-decoration:none;display:inline-block;">WhatsApp bhejo</a><br><br><a href="index.html">Back Home</a>`;window.scrollTo(0,document.body.scrollHeight);}</script></body></html>
