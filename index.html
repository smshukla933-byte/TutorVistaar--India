<form action="https://wa.me/919336871629" method="get"><form id="studentForm"><form action="https://wa.me/919336871629" method="get"><form id="teacherForm"><script>
const whatsappNumber = "919336871629";

function sendToWhatsApp(formId, title) {
  const form = document.getElementById(formId);

  form.addEventListener("submit", function(e) {
    e.preventDefault();

    const data = new FormData(form);
    let message = `*${title}*\n\n`;

    for (const [key, value] of data.entries()) {
      if (value.trim() !== "") {
        message += `*${key}:* ${value}\n`;
      }
    }

    const url =
      "https://wa.me/" +
      whatsappNumber +
      "?text=" +
      encodeURIComponent(message);

    window.open(url, "_blank");
  });
}

sendToWhatsApp("studentForm", "TutorVistaar - New Student Requirement");
sendToWhatsApp("teacherForm", "TutorVistaar - New Teacher Registration");
</script>
