
<!doctype html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class 10 Hindi Practice Test | TutorVistaar</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f3ff;color:#222;margin:0;padding:16px}
header{background:#6d28d9;color:white;text-align:center;padding:20px;border-radius:14px}
main{max-width:700px;margin:20px auto}.card{background:white;padding:20px;border-radius:14px;margin:15px 0;box-shadow:0 2px 8px #ddd}
.option{display:block;padding:12px;border:1px solid #ddd;border-radius:8px;margin:9px 0}
button{background:#6d28d9;color:white;border:0;border-radius:8px;padding:12px 18px;font-size:16px;margin-top:12px}
a{color:#6d28d9;margin-right:12px}#feedback{background:#f3e8ff;padding:12px;border-radius:8px;margin-top:12px}
</style>
</head>
<body>
<header><h1>📚 Class 10 Hindi Test</h1><p>TutorVistaar India | UP Board Revision</p></header>
<main>
<div class="card"><p>10 MCQ हल करो और अपना स्कोर देखो।</p><p id="progress"></p></div>
<div class="card" id="quiz">
<h3 id="question"></h3><div id="options"></div>
<div id="feedback" hidden></div>
<button id="check" onclick="checkAnswer()">उत्तर जाँचें</button>
<button id="next" onclick="nextQuestion()" hidden>अगला प्रश्न →</button>
</div>
<div class="card" id="result" hidden><h2>टेस्ट पूरा! 🎉</h2><h3 id="score"></h3><div id="review"></div><button onclick="restart()">फिर से टेस्ट दें</button></div>
<div class="card"><a href="index.html">Homepage</a><a href="maths-practice-test.html">Maths</a><a href="science-practice-test.html">Science</a><a href="sst-practice-test.html">SST</a></div>
</main>
<script>
const data=[
{q:"‘राम विद्यालय जाता है।’ इस वाक्य में क्रिया कौन-सी है?",o:["राम","विद्यालय","जाता है","है"],a:2,e:"‘जाता है’ क्रिया है, जो कार्य का बोध कराती है।"},
{q:"‘सुंदर’ शब्द का विलोम क्या है?",o:["मनोहर","कुरूप","अच्छा","सुशील"],a:1,e:"सुंदर का विलोम कुरूप है।"},
{q:"‘जल’ का पर्यायवाची शब्द कौन-सा है?",o:["अग्नि","पवन","नीर","आकाश"],a:2,e:"जल के पर्यायवाची नीर, पानी और वारि हैं।"},
{q:"‘आँखों का तारा’ मुहावरे का अर्थ क्या है?",o:["बहुत प्यारा","बहुत क्रोधित","बहुत दूर","बहुत तेज"],a:0,e:"इस मुहावरे का अर्थ है बहुत प्यारा होना।"},
{q:"‘विद्यालय’ शब्द में कौन-सी संधि है?",o:["गुण संधि","दीर्घ संधि","वृद्धि संधि","यण संधि"],a:1,e:"विद्या + आलय = विद्यालय; यहाँ आ + आ से दीर्घ स्वर बनता है।"},
{q:"‘जो कभी न मरे’ के लिए एक शब्द क्या है?",o:["अजर","अमर","अज्ञानी","अटल"],a:1,e:"जो कभी न मरे, उसे अमर कहते हैं।"},
{q:"‘लड़का’ का बहुवचन क्या है?",o:["लड़की","लड़कों","लड़के","लड़कियाँ"],a:2,e:"लड़का का सामान्य बहुवचन लड़के है।"},
{q:"‘नाच न जाने आँगन टेढ़ा’ लोकोक्ति का अर्थ क्या है?",o:["नाचना सीखना","अपनी कमी का दोष दूसरों पर लगाना","आँगन साफ करना","खुश होना"],a:1,e:"इसका अर्थ है अपनी कमी का दोष दूसरों पर लगाना।"},
{q:"‘सीता ने पत्र लिखा।’ यह किस वाच्य का उदाहरण है?",o:["कर्तृवाच्य","कर्मवाच्य","भाववाच्य","इनमें से कोई नहीं"],a:0,e:"वाक्य में कर्ता ‘सीता’ मुख्य है, इसलिए यह कर्तृवाच्य है।"},
{q:"‘ईमानदार’ शब्द में मूल शब्द कौन-सा है?",o:["ईमान","दार","मानदार","ई"],a:0,e:"ईमान + दार से ईमानदार शब्द बनता है।"}
];
let i=0,score=0,answered=false;
function render(){
 answered=false;document.getElementById("progress").textContent="प्रश्न "+(i+1)+" / "+data.length;
 document.getElementById("question").textContent=(i+1)+". "+data[i].q;
 document.getElementById("options").innerHTML=data[i].o.map((v,j)=>'<label class="option"><input type="radio" name="ans" value="'+j+'"> '+String.fromCharCode(65+j)+'. '+v+'</label>').join("");
 document.getElementById("feedback").hidden=true;document.getElementById("check").hidden=false;document.getElementById("next").hidden=true;
}
function checkAnswer(){
 if(answered)return;let s=document.querySelector('input[name="ans"]:checked');
 if(!s){alert("पहले एक उत्तर चुनें।");return}
 answered=true;let chosen=Number(s.value),q=data[i];if(chosen===q.a)score++;
 let f=document.getElementById("feedback");
 f.innerHTML=(chosen===q.a?"✅ सही जवाब!":"❌ सही जवाब: "+String.fromCharCode(65+q.a)+". "+q.o[q.a])+"<br>"+q.e;
 f.hidden=false;document.getElementById("check").hidden=true;document.getElementById("next").hidden=false;
 document.getElementById("next").textContent=i===data.length-1?"परिणाम देखें":"अगला प्रश्न →";
}
function nextQuestion(){
 if(i<data.length-1){i++;render();return}
 document.getElementById("quiz").hidden=true;document.getElementById("result").hidden=false;
 document.getElementById("score").textContent="आपका स्कोर: "+score+" / "+data.length;
 document.getElementById("review").innerHTML="<h3>दोहराएँ</h3>"+data.map((q,j)=>"<p><b>"+(j+1)+". "+q.o[q.a]+"</b><br>"+q.e+"</p>").join("");
}
function restart(){i=0;score=0;document.getElementById("result").hidden=true;document.getElementById("quiz").hidden=false;render()}
render();
</script>
</body>
</html>
